<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PortalAI - Internship Details</title>
    <!-- CSS Dependencies -->
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/internship-details.css">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="app-layout">
        <!-- Sidebar Injection -->
        <div id="sidebar-container"></div>

        <!-- Main Workspace -->
        <main class="main-content">
            <!-- Header navigation -->
            <header class="detail-navigation-bar">
                <a href="internships.html" class="btn-back">
                    <i class="fa-solid fa-arrow-left"></i> Back to Finder
                </a>
            </header>

            <!-- Status banner -->
            <div id="alert-box" class="alert-box hidden">
                <i class="alert-icon fa-solid"></i>
                <span id="alert-message"></span>
            </div>

            <!-- Detailed Grid Row -->
            <div class="details-grid-wrapper" id="details-grid-wrapper">
                <!-- Loaded dynamically by JS -->
                <div class="loading-state">
                    <i class="fa-solid fa-spinner fa-spin"></i>
                    <span>Resolving internship description...</span>
                </div>
            </div>
        </main>
    </div>

    <!-- Script Loading -->
    <script type="module" src="js/sidebar.js"></script>
    <script type="module" src="js/internship-details.js"></script>
</body>
</html>
