<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PortalAI - Create Account</title>
    <meta name="description" content="Register for PortalAI - AI-powered internship recommendation portal for students">
    <!-- CSS Dependencies -->
    <link rel="stylesheet" href="css/register.css">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <div class="auth-background-radial"></div>

    <div class="container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="brand">
                    <i class="fa-solid fa-graduation-cap brand-icon"></i>
                    <span>PortalAI</span>
                </div>
                <h1>Create Account</h1>
                <p class="subtitle">Join PortalAI to get matched with remote tech internships</p>
            </div>

            <!-- Message Notification Alert Banner -->
            <div id="alert-box" class="alert-box hidden">
                <i class="alert-icon fa-solid"></i>
                <span id="alert-message"></span>
            </div>

            <!-- Google Sign-In Button (top of form for convenience) -->
            <button type="button" class="btn-google" id="btn-google">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" class="google-icon">
                <span>Sign up with Google</span>
            </button>

            <!-- Divider -->
            <div class="auth-divider">
                <span>or register with email</span>
            </div>

            <form id="register-form" onsubmit="return false;">
                <div class="input-group">
                    <label for="name">Full Name</label>
                    <div class="input-wrapper">
                        <i class="input-icon fa-solid fa-user"></i>
                        <input type="text" id="name" placeholder="John Doe" required autocomplete="name">
                    </div>
                </div>

                <div class="input-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <i class="input-icon fa-solid fa-envelope"></i>
                        <input type="email" id="email" placeholder="name@college.edu" required autocomplete="email">
                    </div>
                </div>

                <div class="input-group">
                    <label for="phone">Phone Number</label>
                    <div class="input-wrapper">
                        <i class="input-icon fa-solid fa-phone"></i>
                        <input type="tel" id="phone" placeholder="+1 (555) 000-0000" required autocomplete="tel">
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i class="input-icon fa-solid fa-lock"></i>
                        <input type="password" id="password" placeholder="At least 6 characters" required autocomplete="new-password">
                        <button type="button" class="password-toggle-btn" id="password-toggle" tabindex="-1">
                            <i class="fa-regular fa-eye-slash" id="toggle-icon"></i>
                        </button>
                    </div>
                </div>

                <div class="input-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="input-wrapper">
                        <i class="input-icon fa-solid fa-lock"></i>
                        <input type="password" id="confirmPassword" placeholder="Confirm password" required autocomplete="new-password">
                        <button type="button" class="password-toggle-btn" id="confirm-password-toggle" tabindex="-1">
                            <i class="fa-regular fa-eye-slash" id="confirm-toggle-icon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="btn-register">
                    <span>Register</span>
                    <i class="fa-solid fa-user-plus"></i>
                </button>
            </form>

            <div class="auth-footer">
                <p>Already have an account? <a href="index.html" class="auth-link">Log In</a></p>
            </div>
        </div>
    </div>

    <!-- ES Module Script Loading for Firebase Support -->
    <script type="module" src="js/auth.js"></script>
</body>
</html>
